; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nayanbhai_hardware_board

; Development build, serial logs on
[env:nayanbhai_hardware_board]
platform = espressif32
board = nayanbhai_hardware_board_uart
framework = arduino
upload_protocol = esptool
monitor_speed = 115200
build_flags =
	-Wall
	-Wextra
lib_deps =
	robtillaart/TCA9555@^0.4.4
	waspinator/AccelStepper@^1.64

; Production build, all serial logs removed
[env:prod]
extends = env:nayanbhai_hardware_board
build_flags =
	${env:nayanbhai_hardware_board.build_flags}
	-DLOG_ENABLED=0

; Standalone stepper test, builds only debug/stepper_test (no machine firmware)
; pio run -e stepper_test -t upload
[env:stepper_test]
extends = env:nayanbhai_hardware_board
build_src_filter = -<*> +<../debug/stepper_test/>
